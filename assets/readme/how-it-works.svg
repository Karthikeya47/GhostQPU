<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">How GhostQPU works</title>
<desc id="desc">Your Batch hides 30 Canary circuits. Either an IBM quantum computer or the Forger (Aer plus public calibration) runs it. Twelve Canary features over eight time chunks feed the Detector, which returns Genuine or Forged.</desc>
<defs><radialGradient id="glow" cx="72%" cy="0%" r="90%"><stop offset="0" stop-color="#16406c"/><stop offset="1" stop-color="#030b17"/></radialGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#glow)"/>
<rect x="40" y="140" width="220" height="100" rx="16" fill="#071a30" stroke="#8fd3ff" stroke-opacity="0.6" stroke-width="1.5"/><text x="150.0" y="186.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eaf4ff">Your Batch</text><text x="150.0" y="214.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8aa3c0">30 hidden Canaries</text>
<path d="M260 190 L330 110" stroke="#8fd3ff" stroke-opacity="0.7" stroke-width="2" fill="none"/><circle cx="330" cy="110" r="4" fill="#8fd3ff"/>
<path d="M260 190 L330 270" stroke="#eb6834" stroke-opacity="0.7" stroke-width="2" fill="none"/><circle cx="330" cy="270" r="4" fill="#eb6834"/>
<rect x="330" y="60" width="260" height="100" rx="16" fill="#071a30" stroke="#5aa0f2" stroke-opacity="0.6" stroke-width="1.5"/><text x="460.0" y="106.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eaf4ff">IBM quantum computer</text><text x="460.0" y="134.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8aa3c0">honest provider</text>
<rect x="330" y="220" width="260" height="100" rx="16" fill="#071a30" stroke="#eb6834" stroke-opacity="0.6" stroke-width="1.5"/><text x="460.0" y="266.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eaf4ff">Forger</text><text x="460.0" y="294.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8aa3c0">Aer + public calibration</text>
<path d="M590 110 L650 190" stroke="#8fd3ff" stroke-opacity="0.7" stroke-width="2" fill="none"/><circle cx="650" cy="190" r="4" fill="#8fd3ff"/>
<path d="M590 270 L650 190" stroke="#eb6834" stroke-opacity="0.7" stroke-width="2" fill="none"/><circle cx="650" cy="190" r="4" fill="#eb6834"/>
<rect x="650" y="140" width="230" height="100" rx="16" fill="#071a30" stroke="#8fd3ff" stroke-opacity="0.6" stroke-width="1.5"/><text x="765.0" y="186.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eaf4ff">Signature</text><text x="765.0" y="214.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8aa3c0">12 features × 8 chunks</text>
<path d="M880 190 L930 190" stroke="#8fd3ff" stroke-opacity="0.7" stroke-width="2" fill="none"/><circle cx="930" cy="190" r="4" fill="#8fd3ff"/>
<rect x="930" y="110" width="230" height="76" rx="16" fill="#0a2340" stroke="#5aa0f2" stroke-opacity="0.6" stroke-width="1.5"/><text x="1045.0" y="144.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eaf4ff">|GENUINE〉</text><text x="1045.0" y="172.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8aa3c0"></text>
<rect x="930" y="200" width="230" height="76" rx="16" fill="#2a1408" stroke="#eb6834" stroke-opacity="0.6" stroke-width="1.5"/><text x="1045.0" y="234.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eaf4ff">|FORGED〉</text><text x="1045.0" y="262.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8aa3c0"></text>
<text x="40" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8aa3c0">Canaries measure what the calibration leaves out: over-rotation, neighbor crosstalk, readout context, drift.</text>
</svg>
