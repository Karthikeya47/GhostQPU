<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">GhostQPU results</title>
<desc id="desc">30 of 30 later jobs called correctly by a Detector frozen on 10 October; 3 IBM machines and 12 calibration cycles; 1.5 QPU seconds of Canaries still catches all 34 jobs.</desc>
<defs><radialGradient id="glow" cx="72%" cy="0%" r="90%"><stop offset="0" stop-color="#16406c"/><stop offset="1" stop-color="#030b17"/></radialGradient></defs>
<rect width="1200" height="300" rx="24" fill="url(#glow)"/>
<rect x="48" y="40" width="352" height="220" rx="18" fill="#071a30" stroke="#8fd3ff" stroke-opacity="0.22"/><text x="80" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="300" fill="#eaf4ff" letter-spacing="-2">30/30</text><text x="82" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8aa3c0">jobs called right by a</text><text x="82" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8aa3c0">Detector frozen on 10 Oct</text>
<rect x="424" y="40" width="352" height="220" rx="18" fill="#071a30" stroke="#8fd3ff" stroke-opacity="0.22"/><text x="456" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="300" fill="#eaf4ff" letter-spacing="-2">3 · 12</text><text x="458" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8aa3c0">IBM machines ·</text><text x="458" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8aa3c0">calibration cycles</text>
<rect x="800" y="40" width="352" height="220" rx="18" fill="#071a30" stroke="#8fd3ff" stroke-opacity="0.22"/><text x="832" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="300" fill="#eaf4ff" letter-spacing="-2">1.5 s</text><text x="834" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8aa3c0">of QPU time for Canaries</text><text x="834" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8aa3c0">still catches all 34 jobs</text>
</svg>
